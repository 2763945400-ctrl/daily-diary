<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日一记</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<main id="view">
  <section class="page page-today" id="page-today">
    <header class="today-head">
      <h1 class="page-title" id="today-date"></h1>
      <button class="chip-pending" id="pending-chip" type="button" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5v-3h3.56c.69 1.19 1.97 2 3.45 2s2.75-.81 3.45-2H19v3zm0-5h-4.99c0 1.1-.9 2-2 2s-2-.9-2-2H5V5h14v9z"/></svg><span id="pending-count"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z"/></svg>
      </button>
    </header>

    <div class="write-card">
      <textarea class="field-area" id="entry-text" rows="5"
                placeholder="今天过得怎么样？"></textarea>
      <figure class="photo-slot" id="photo-slot" hidden>
        <img id="photo-preview" alt="今天的照片">
        <button class="photo-remove" id="photo-remove" type="button" aria-label="移除照片"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
      </figure>
      <button class="add-photo" id="add-photo" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20H4V6h9V4H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9h-2v9zm-7.79-3.17-1.96-2.36L5.5 18h11l-3.54-4.71zM20 4V1h-2v3h-3c.01.01 0 2 0 2h3v2.99c.01.01 2 0 2 0V6h3V4h-3z"/></svg><span>添加照片</span></button>
      <input class="visually-hidden" id="photo-input" type="file" accept="image/*">
    </div>
    <a class="med-entry" href="#/meditate">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2c-2.24 0-4.16-.96-5.6-2.68l-1.34-1.6A1.98 1.98 0 0 0 12.53 9h-1.05c-.59 0-1.15.26-1.53.72l-1.34 1.6C7.16 13.04 5.24 14 3 14v2c2.77 0 5.19-1.17 7-3.25V15l-3.88 1.55c-.67.27-1.12.93-1.12 1.66C5 19.2 5.8 20 6.79 20H9v-.5a2.5 2.5 0 0 1 2.5-2.5h3c.28 0 .5.22.5.5s-.22.5-.5.5h-3c-.83 0-1.5.67-1.5 1.5v.5h7.21c.99 0 1.79-.8 1.79-1.79 0-.73-.45-1.39-1.12-1.66L14 15v-2.25c1.81 2.08 4.23 3.25 7 3.25z"/></svg>
      <span class="med-entry-text">
        <span class="t1">先静坐片刻</span>
        <span class="t2">清空思绪，再写今天</span>
      </span>
      <svg class="ic chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z"/></svg>
    </a>

    <button class="btn-save" id="save-entry" type="button">记下今天</button>
  </section>

  <section class="page" id="page-review" hidden>
    <div class="cal-card" id="cal-card" hidden>
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" type="button" aria-label="上个月"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59z"/></svg></button>
        <div class="cal-month" id="cal-month"></div>
        <button class="cal-nav" id="cal-next" type="button" aria-label="下个月"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z"/></svg></button>
      </div>
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="entry-list" id="entry-list"></div>
    <p class="empty" id="review-empty" hidden>还没有记录，去「今天」写下第一条吧</p>
  </section>

  <section class="page" id="page-settings" hidden>
    <h1 class="page-title">设置</h1>

    <h2 class="sec-label">数据</h2>
    <div class="s-card">
      <button class="tile" id="export-backup" type="button">
        <span class="lead"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5z"/></svg></span>
        <span class="tt"><span class="title">导出备份</span><span class="sub" id="export-sub"></span></span>
      </button>
      <div class="divider"></div>
      <button class="tile" id="import-backup" type="button">
        <span class="lead"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm3-10.17L14.17 8H13v6h-2V8H9.83L12 5.83zM5 18h14v2H5z"/></svg></span>
        <span class="tt"><span class="title">导入备份</span><span class="sub">只补充缺少的日期，不覆盖已有记录</span></span>
      </button>
      <div class="divider"></div>
      <button class="tile tile-danger" id="clear-all" type="button">
        <span class="lead"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/></svg></span>
        <span class="tt"><span class="title">清空全部数据</span></span>
      </button>
    </div>
    <input class="visually-hidden" id="import-input" type="file" accept="application/json,.json">

    <h2 class="sec-label">隐私</h2>
    <div class="s-card">
      <p class="privacy">你的全部记录（文字和照片）只保存在这台设备上。<br>没有服务器，没有账号，没有人能看到你写了什么。<br>也因此：换设备前请先「导出备份」，数据不会自动跟着你走。</p>
    </div>

    <p class="version" id="app-version"></p>
  </section>

  <section class="page page-dark" id="page-meditate" hidden>
    <a class="med-close" href="#/today" aria-label="退出静坐">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
    </a>
    <p class="stub stub-dark">呼吸圆环与钟声 —— 第 5 步实现。</p>
  </section>
</main>

<button class="fab" id="capture-fab" type="button" aria-label="随手记一条" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="capture-sheet" role="dialog" aria-label="随手记" hidden>
  <div class="sheet-handle"></div>
  <textarea class="sheet-field" id="capture-text" rows="4"
            placeholder="此刻的想法，随手记下"></textarea>
  <div class="sheet-actions">
    <button class="btn-tonal" id="capture-save" type="button">记下</button>
  </div>
</div>

<div class="sheet" id="inbox-sheet" role="dialog" aria-label="待整理" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <span class="sheet-title">待整理</span>
    <span class="sheet-count" id="inbox-count"></span>
    <button class="sheet-close" id="inbox-close" type="button" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
  </div>
  <div class="inbox-list" id="inbox-list"></div>
</div>

<div class="sheet" id="entry-sheet" role="dialog" aria-label="日记详情" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <span class="sheet-title" id="detail-date"></span>
    <span class="spacer"></span>
    <button class="sheet-close" id="detail-close" type="button" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
  </div>
  <div class="entry-detail">
    <img id="detail-photo" alt="这天的照片" hidden>
    <p class="entry-detail-text" id="detail-text"></p>
  </div>
</div>

<div class="dialog" id="confirm-clear" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <h2 class="dialog-title" id="confirm-title">清空全部数据？</h2>
  <p class="dialog-text">全部日记和碎片都会删掉，删了找不回来。建议先「导出备份」。</p>
  <div class="dialog-actions">
    <button class="btn-text" id="confirm-cancel" type="button">取消</button>
    <button class="btn-text btn-danger" id="confirm-ok" type="button">清空</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button class="toast-action" id="toast-action" type="button" hidden></button>
</div>

<nav id="nav" aria-label="主导航">
  <a class="nav-item" href="#/today" data-route="today">
    <span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
    <span class="nav-label">今天</span>
  </a>
  <a class="nav-item" href="#/review" data-route="review">
    <span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg></span>
    <span class="nav-label">回顾</span>
  </a>
  <a class="nav-item" href="#/settings" data-route="settings">
    <span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.566.566 0 0 0-.18-.03c-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.37.29.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg></span>
    <span class="nav-label">设置</span>
  </a>
</nav>

<script type="module" src="./src/main.js"></script>
</body>
</html>
