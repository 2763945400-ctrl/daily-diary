<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接诊断</title>
<style>
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       margin:0;padding:16px;background:#fff;color:#222}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#888;font-size:13px;margin-bottom:16px}
  .row{border:1px solid #e5e5e5;border-radius:10px;padding:12px;margin-bottom:8px}
  .name{font-weight:600}
  .size{color:#888;font-size:13px}
  .res{margin-top:6px;font-size:15px}
  .ok{color:#2a7d3f}.bad{color:#c0392b}.run{color:#888}
  #sum{margin-top:16px;padding:14px;border-radius:10px;background:#f4f4f4;
       font-size:15px;white-space:pre-wrap}
  b{font-size:17px}
</style>

<h1>每日一记 · 连接诊断</h1>
<div class="sub" id="t"></div>

<div class="row"><div class="name">① 页面本身</div>
  <div class="size">约 3 KB</div>
  <div class="res ok">✅ 你能看到这行字，说明域名是通的</div></div>

<div class="row" id="r0"><div class="name">② 小文件</div>
  <div class="size">传输约 3 KB</div><div class="res run">测试中…</div></div>

<div class="row" id="r1"><div class="name">③ 中文字体</div>
  <div class="size">传输约 1.3 MB</div><div class="res run">等待…</div></div>

<div class="row" id="r2"><div class="name">④ 程序代码</div>
  <div class="size">传输约 0.9 MB</div><div class="res run">等待…</div></div>

<div class="row" id="r3"><div class="name">⑤ 渲染引擎（最大）</div>
  <div class="size">传输约 2.1 MB</div><div class="res run">等待…</div></div>

<div id="sum">测试进行中，请保持页面打开…</div>

<script>
// 依次下载站点上真实的几个文件，逐级加大，看在哪一级断掉。
// 每个都带时间戳绕过缓存，确保测的是真实网络。
const tests = [
  ['r0', 'flutter_bootstrap.js',                        3],
  ['r1', 'assets/assets/fonts/NotoSansSC-subset.ttf', 1376],
  ['r2', 'main.dart.js',                              894],
  ['r3', 'canvaskit/chromium/canvaskit.wasm',        2134],
];
const TIMEOUT = 40000;               // 单个文件最多等 40 秒
const log = [];
document.getElementById('t').textContent = new Date().toLocaleString('zh-CN');

async function one(id, url, kb) {
  const el = document.querySelector('#' + id + ' .res');
  el.className = 'res run';
  el.textContent = '下载中…';
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT);
  const t0 = performance.now();
  try {
    const res = await fetch(url + '?_=' + Date.now(), {signal: ctl.signal, cache: 'no-store'});
    const buf = await res.arrayBuffer();
    clearTimeout(timer);
    const sec = (performance.now() - t0) / 1000;
    const speed = Math.round(kb / sec);
    el.className = 'res ok';
    el.textContent = `✅ 成功 · ${sec.toFixed(1)} 秒 · 约 ${speed} KB/秒`;
    log.push(`${kb}KB 成功 ${sec.toFixed(1)}s`);
    return true;
  } catch (e) {
    clearTimeout(timer);
    const sec = (performance.now() - t0) / 1000;
    const why = e.name === 'AbortError' ? `超时（等了 ${sec.toFixed(0)} 秒还没完）` : '连接失败';
    el.className = 'res bad';
    el.textContent = '❌ ' + why;
    log.push(`${kb}KB 失败(${why})`);
    return false;
  }
}

(async () => {
  let lastOk = 0, firstFail = null;
  for (const [id, url, kb] of tests) {
    const ok = await one(id, url, kb);
    if (ok) { lastOk = Math.max(lastOk, kb); }
    else if (firstFail === null) { firstFail = kb; }
  }
  const s = document.getElementById('sum');
  if (firstFail === null) {
    s.innerHTML = '<b>结论：全部通过 ✅</b>\n\n' +
      '这个网络下 4.4 MB 全都能下完。App 打不开是别的原因，把这页截图发我。\n\n' + log.join('\n');
  } else if (lastOk === 0) {
    s.innerHTML = '<b>结论：域名能开，但一个文件都下不来 ❌</b>\n\n' +
      '说明连接被掐得很死。换托管是唯一出路，重写成小体积没用。\n\n' + log.join('\n');
  } else {
    s.innerHTML = `<b>结论：小的能下，大的下不来 ⚠️</b>\n\n` +
      `能下完的最大约 ${lastOk} KB，从约 ${firstFail} KB 开始失败。\n` +
      `说明是体积问题——做小体积的网页版会有效。\n\n` + log.join('\n');
  }
})();
</script>
