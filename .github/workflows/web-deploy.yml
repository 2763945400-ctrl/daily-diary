# 编译网页版并发布到 GitHub Pages
# 只管网页版，iOS 打包在 ios-build.yml，两条流水线互不影响
#
# 2026-09-07 起只发新版（app/ 的原生重写，约 21 KB）。
# 老的 Flutter 网页版（4.4 MB）不再编译上网 —— 但 lib/ web/ assets/ pubspec.yaml
# **全部原样留在仓库里**（规格第四节：新版验证通过前不许删任何东西）。
# 真要回滚就是把这个文件恢复到 87187cc 那一版，Flutter 网页版会原样回来。
name: Deploy Web

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [master]
    paths: # Flutter 不再参与网页版，改 lib/ 不该再触发部署
      - 'app/**'
      - '.github/workflows/web-deploy.yml'

# 发布 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新的排队等旧的跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci 而不是 npm install：按 package-lock.json 装死版本，
      # CI 里装出来的和本地验过的必须是同一套
      - run: npm ci
        working-directory: app

      - run: npm test
        working-directory: app

      # app/vite.config.js 的 base 是相对路径 './'，
      # 所以发到根路径还是子路径都不用改配置
      - run: npm run build
        working-directory: app

      # 前提：仓库 Settings → Pages → Source 已选 "GitHub Actions"
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
