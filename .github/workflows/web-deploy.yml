# 编译网页版并发布到 GitHub Pages
# 只管网页版，iOS 打包在 ios-build.yml，两条流水线互不影响
name: Deploy Web

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [master]
    paths: # 只有代码变了才编译，改文档不浪费时间
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/web-deploy.yml'

# 发布 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新的排队等旧的跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get

      # base-href 必须写成 /仓库名/，项目页网址是 用户名.github.io/仓库名/
      # 少了这个，打开是白屏
      #
      # --no-web-resources-cdn：渲染引擎 CanvasKit(约 7MB) 默认从 www.gstatic.com 下载，
      # 国内连不上就一直白屏且不报错。加这个参数改成打包进自己的站点。
      - run: flutter build web --release --base-href /daily-diary/ --no-web-resources-cdn

      # 前提：仓库 Settings → Pages → Source 已选 "GitHub Actions"
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
